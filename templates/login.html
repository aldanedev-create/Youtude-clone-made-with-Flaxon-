<!-- templates/login.html -->
{% extends "base.html" %}

{% block title %}Login - FlaxTube{% endblock %}

{% block content %}
<div class="auth-container">
    <h1>Login</h1>
    <form id="login-form">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autocomplete="username">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <button type="submit" id="submit-btn" class="btn-primary">Login</button>
    </form>
    <p>Don't have an account? <a href="/signup">Sign up</a></p>
    <div id="auth-status"></div>
</div>

<script>
document.getElementById('login-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const status = document.getElementById('auth-status');
    const submitBtn = document.getElementById('submit-btn');
    
    status.innerHTML = '<p style="color: #888;">Logging in...</p>';
    submitBtn.disabled = true;
    
    try {
        const response = await fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        
        const contentType = response.headers.get('content-type');
        if (contentType && contentType.includes('application/json')) {
            const data = await response.json();
            
            if (response.ok) {
                window.location.href = '/';
            } else {
                const errorMessage = data.error?.message || data.message || data.detail || 'Login failed';
                status.innerHTML = `<div class="error">${errorMessage}</div>`;
            }
        } else {
            if (response.redirected) {
                window.location.href = response.url;
            } else {
                status.innerHTML = '<div class="error">Server error. Please try again.</div>';
            }
        }
    } catch (error) {
        status.innerHTML = `<div class="error">Login failed: ${error.message}</div>`;
    } finally {
        submitBtn.disabled = false;
    }
});
</script>
{% endblock %}
