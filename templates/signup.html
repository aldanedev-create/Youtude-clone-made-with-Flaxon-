<!-- templates/signup.html -->
{% extends "base.html" %}

{% block title %}Sign Up - FlaxTube{% endblock %}

{% block content %}
<div class="auth-container">
    <h1>Sign Up</h1>
    <form id="signup-form">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required minlength="3">
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required minlength="6">
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" required>
        </div>
        <button type="submit" class="btn-primary">Sign Up</button>
    </form>
    <p>Already have an account? <a href="/login">Login</a></p>
    <div id="auth-status"></div>
</div>

<script>
document.getElementById('signup-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const username = document.getElementById('username').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const confirm_password = document.getElementById('confirm_password').value;
    const status = document.getElementById('auth-status');
    
    // Clear previous status
    status.innerHTML = '';
    
    // Basic validation
    if (password !== confirm_password) {
        status.innerHTML = '<div class="error">Passwords do not match</div>';
        return;
    }
    
    if (password.length < 6) {
        status.innerHTML = '<div class="error">Password must be at least 6 characters</div>';
        return;
    }
    
    status.innerHTML = '<p style="color: #888;">Creating account...</p>';
    
    try {
        const response = await fetch('/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, email, password, confirm_password })
        });
        
        // Check if response is JSON
        const contentType = response.headers.get('content-type');
        if (contentType && contentType.includes('application/json')) {
            const data = await response.json();
            
            if (response.ok) {
                window.location.href = '/';
            } else {
                status.innerHTML = `<div class="error">${data.error?.message || 'Sign up failed'}</div>`;
            }
        } else {
            // If not JSON, it's likely a redirect or error page
            if (response.redirected) {
                window.location.href = response.url;
            } else {
                status.innerHTML = '<div class="error">Server error. Please try again.</div>';
            }
        }
    } catch (error) {
        status.innerHTML = `<div class="error">Sign up failed: ${error.message}</div>`;
    }
});
</script>
{% endblock %}
