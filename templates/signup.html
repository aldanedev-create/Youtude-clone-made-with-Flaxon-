{% extends "base.html" %}

{% block title %}Sign Up - FlaxTube{% endblock %}

{% block content %}
<div class="auth-container">
    <h1>Sign Up</h1>
    <form id="signup-form">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required minlength="3">
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required minlength="6">
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" required>
        </div>
        <button type="submit" class="btn-primary">Sign Up</button>
    </form>
    <p>Already have an account? <a href="/login">Login</a></p>
    <div id="auth-status"></div>
</div>

<script>
document.getElementById('signup-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    const data = Object.fromEntries(formData);
    const status = document.getElementById('auth-status');
    
    if (data.password !== data.confirm_password) {
        status.innerHTML = '<div class="error">Passwords do not match</div>';
        return;
    }
    
    try {
        const response = await fetch('/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        
        if (response.ok) {
            window.location.href = '/login';
        } else {
            const error = await response.json();
            status.innerHTML = `<div class="error">${error.error?.message || 'Sign up failed'}</div>`;
        }
    } catch (error) {
        status.innerHTML = `<div class="error">Sign up failed</div>`;
    }
});
</script>
{% endblock %}
